[project]
name = "synapse-crs"
version = "0.1.0"
description = "Fail-closed control-plane foundation for Synapse-CRS."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14.0",
    "fastapi>=0.115.0",
    "jsonschema>=4.23.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "psycopg[binary]>=3.2.0",
    "sqlalchemy>=2.0.36",
    "uvicorn>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
pythonpath = [
    ".",
    "packages/contracts/src",
    "packages/policy/src",
    "packages/audit/src",
    "packages/cases/src",
    "packages/telemetry/src",
    "apps/api/src",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps", "packages", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
# FastAPI uses Depends() and Query() in parameter defaults.
ignore = ["B008"]
