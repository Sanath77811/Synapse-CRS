name: synapse-crs

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      SYNAPSE_APP_PASSWORD: ${SYNAPSE_APP_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - synapse_pg_data:/var/lib/postgresql/data
      - ./postgres/init-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    entrypoint: ["alembic", "-c", "/app/apps/api/alembic.ini", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://synapse_app:${SYNAPSE_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SYNAPSE_ENVIRONMENT: ${SYNAPSE_ENVIRONMENT}
      SYNAPSE_AUTH_TOKENS: ${SYNAPSE_AUTH_TOKENS}
      SYNAPSE_CORS_ORIGINS: ${SYNAPSE_CORS_ORIGINS}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  synapse_pg_data:
